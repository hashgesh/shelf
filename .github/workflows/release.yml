name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe needs the tag history
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - name: Build
        run: make release VERSION="${GITHUB_REF_NAME}"
      - name: Smoke test
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          mkdir smoke
          tar -xzf "shelf_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C smoke
          test -x smoke/shelf   # executable bit survived packing
          smoke/shelf --version | grep -F "${GITHUB_REF_NAME}"
          unzip -l "shelf_${GITHUB_REF_NAME}_windows_amd64.zip" | grep -q 'shelf.exe'
          rm -rf smoke
      - name: Generate release notes with git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "shelf ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --verify-tag
